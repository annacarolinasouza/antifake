# Deploy gratuito no Render (Blueprint). Plano free: 512 MB RAM.
services:
  - type: web
    name: antifake
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL        # cole a connection string do Neon (grátis)
        sync: false
      - key: PUBLIC_URL          # ex.: https://antifake-xxxx.onrender.com
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: WHISPER_MODEL
        value: tiny
      - key: VIDEO_MAX_SECONDS
        value: "90"
      - key: MAX_UPLOAD_MB
        value: "40"

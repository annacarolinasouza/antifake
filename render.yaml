# Deploy gratuito no Render (Blueprint). Plano free: 512 MB RAM, dorme após 15 min sem acesso.
services:
  - type: web
    name: antifake
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: WHISPER_MODEL
        value: tiny
      - key: VIDEO_MAX_SECONDS
        value: "90"
      - key: MAX_UPLOAD_MB
        value: "40"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_FACTCHECK_KEY
        sync: false
